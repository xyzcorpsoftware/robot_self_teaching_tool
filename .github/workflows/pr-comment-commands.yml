name: PR Comment Commands

# Manual column moves via PR comments, e.g. "Done: TM#200, TM#201".
# Complements sync-task-board.yml:
#   - Task Sync section (PR body)  = declarative: "issues this PR relates to"
#   - PR comments (this workflow)  = imperative: "move this issue now"
#
# Security: the comment body is passed via env var (never inline ${{ }})
# to prevent workflow injection.
# ACL: only OWNER/MEMBER/COLLABORATOR comments trigger dispatches.
# See: https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/

on:
  issue_comment:
    types: [created]

jobs:
  process:
    # Early filter: job spins up only for PR comments from a trusted role
    # that contain BOTH "TM#" AND a keyword prefix. Skipped jobs cost 0
    # minutes, so TM# mentions in general chatter never create runners.
    # GitHub `contains()` is case-insensitive, so `Done:` / `done:` / `DONE:`
    # all match — consistent with the case-insensitive grep inside the job.
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, 'TM#') &&
      (contains(github.event.comment.body, 'Start:') ||
       contains(github.event.comment.body, 'Review:') ||
       contains(github.event.comment.body, 'Deploy:') ||
       contains(github.event.comment.body, 'Done:')) &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    # The installation token it mints expires in 60 minutes; this job takes seconds.
    timeout-minutes: 5
    # Nothing here touches this repo through GITHUB_TOKEN.
    permissions: {}
    env:
      # The sender App's private key. Must be a repo-level secret, never org-level:
      # GitHub Free doesn't deliver org secrets to private repos (API reports it
      # configured, runtime gets ""). See CLAUDE.md "Secret management" in
      # xyzcorpsoftware/task-management. Same App and same receiver door as
      # sync-task-board.yml; the reasons are written there.
      SENDER_APP_PRIVATE_KEY: ${{ secrets.TASK_SYNC_SENDER_APP_PRIVATE_KEY }}
      SENDER_APP_CLIENT_ID: Iv23liZzDF9D9VB7zJxi
      TASK_MGMT_REPO: xyzcorpsoftware/task-management
      RECEIVER_WORKFLOW: cross-repo-sync.yml
      RECEIVER_REF: main
      COMMENT_BODY: ${{ github.event.comment.body }}
      COMMENT_URL: ${{ github.event.comment.html_url }}
      COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
      PR_URL: ${{ github.event.issue.html_url }}
      PR_TITLE: ${{ github.event.issue.title }}
      PR_NUMBER: ${{ github.event.issue.number }}

    steps:
      - name: Check the sender App key
        run: |
          if [ -z "$SENDER_APP_PRIVATE_KEY" ]; then
            echo "::error::Repo secret TASK_SYNC_SENDER_APP_PRIVATE_KEY is not set, so this command cannot reach the task board. Set it on this repo (repo-level, not org-level): see CLAUDE.md 'Secret management' in ${TASK_MGMT_REPO}."
            exit 1
          fi

      - name: Mint the sender App token (task board only)
        id: sender-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ env.SENDER_APP_CLIENT_ID }}
          private-key: ${{ secrets.TASK_SYNC_SENDER_APP_PRIVATE_KEY }}
          owner: xyzcorpsoftware
          repositories: task-management

      - name: Parse keyword commands and dispatch
        env:
          SENDER_TOKEN: ${{ steps.sender-token.outputs.token }}
        run: |
          keyword_to_column() {
            case "$(echo "$1" | tr '[:upper:]' '[:lower:]')" in
              start)  echo "dev" ;;
              review) echo "qa" ;;
              deploy) echo "deploy-wait" ;;
              done)   echo "done" ;;
              *)      echo "" ;;
            esac
          }

          # Inputs are strings only; the receiver validates them. A failed dispatch
          # is counted and turns the job red at the end.
          DISPATCH_FAILED=""
          dispatch() {
            local NUM="$1" COLUMN="$2" EVENT="$3"

            if curl -sf -X POST \
              -H "Authorization: Bearer ${SENDER_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${TASK_MGMT_REPO}/actions/workflows/${RECEIVER_WORKFLOW}/dispatches" \
              -d "$(jq -n \
                --arg ref "$RECEIVER_REF" \
                --arg issue_number "$NUM" \
                --arg target_column "$COLUMN" \
                --arg action "move" \
                --arg source_repo "$GITHUB_REPOSITORY" \
                --arg pr_url "$PR_URL" \
                --arg pr_title "$PR_TITLE" \
                --arg pr_event "$EVENT" \
                --arg pr_number "$PR_NUMBER" \
                --arg pr_author "$COMMENT_AUTHOR" \
                '{
                  ref: $ref,
                  inputs: {
                    issue_number: $issue_number,
                    target_column: $target_column,
                    action: $action,
                    source_repo: $source_repo,
                    pr_url: $pr_url,
                    pr_title: $pr_title,
                    pr_event: $pr_event,
                    pr_number: $pr_number,
                    pr_author: $pr_author
                  }
                }')"; then
              echo "  -> Dispatched"
            else
              echo "::error::Failed to dispatch TM#${NUM} to ${TASK_MGMT_REPO}"
              DISPATCH_FAILED="${DISPATCH_FAILED} #${NUM}"
            fi
          }

          # Line-anchored keyword matching. Narrative prose like
          # "this finally closes TM#42" is NOT matched; only lines that begin
          # with a keyword prefix qualify. Supports comma-separated TM#s, e.g.
          #   "Done: TM#1, TM#2"
          MATCHES=$(echo "$COMMENT_BODY" | grep -oiE \
            '^[[:space:]]*(Start|Review|Deploy|Done)[[:space:]]*:[[:space:]]*TM#[0-9]+([[:space:]]*,[[:space:]]*TM#[0-9]+)*' \
            || true)

          if [ -z "$MATCHES" ]; then
            echo "No keyword commands found in comment."
            exit 0
          fi

          DISPATCH_COUNT=0
          MAX_DISPATCHES=10

          while IFS= read -r LINE; do
            [ -z "$LINE" ] && continue

            KEYWORD=$(echo "$LINE" | grep -oiE '(Start|Review|Deploy|Done)' | head -1)
            COLUMN=$(keyword_to_column "$KEYWORD")

            if [ -z "$COLUMN" ]; then
              echo "::warning::Unknown keyword in: ${LINE}"
              continue
            fi

            for NUM in $(echo "$LINE" | grep -oiE 'TM#[0-9]+' | grep -oE '[0-9]+'); do
              DISPATCH_COUNT=$((DISPATCH_COUNT + 1))
              if [ "$DISPATCH_COUNT" -gt "$MAX_DISPATCHES" ]; then
                echo "::warning::Max ${MAX_DISPATCHES} commands reached."
                break 2
              fi

              EVENT="Comment command by @${COMMENT_AUTHOR}: ${KEYWORD} (${COMMENT_URL})"
              echo "Command: ${KEYWORD} TM#${NUM} -> ${COLUMN}"
              dispatch "$NUM" "$COLUMN" "$EVENT"
            done
          done <<< "$MATCHES"

          if [ -n "$DISPATCH_FAILED" ]; then
            echo "::error::Dispatch failed for${DISPATCH_FAILED}. The task board did not move them; post the command again or move them by hand."
            exit 1
          fi
